    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Era Gadgets",
      "url": "https://eragadgets.ng",
      "logo": "https://eragadgets.ng/logo.png",
      "description": "Premium Nigerian consumer electronics retailer specializing in genuine iPhones, MacBooks, Samsung Galaxy, and luxury tech gadgets.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lagos",
        "addressRegion": "Lagos State",
        "addressCountry": "NG"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://eragadgets.ng/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <body class="bg-[#FBFBFB] text-[#121212] antialiased selection:bg-neutral-900 selection:text-white">
